{% if form.non_field_errors %}
<div class="alert alert-danger" role="alert">{% for e in form.non_field_errors %}{{ e }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>
{% endif %}
{% for campo in form %}
<div class="mb-3">
  <label class="form-label fw-semibold" for="{{ campo.id_for_label }}">{{ campo.label }}{% if not campo.field.required %} <span class="text-secondary fw-normal">(opcional)</span>{% endif %}</label>
  {{ campo }}
  {% for e in campo.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
</div>
{% endfor %}
